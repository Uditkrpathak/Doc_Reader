name: Build iOS IPA (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ufv_rn_poc/package-lock.json'

      - name: Install NPM dependencies
        working-directory: ./ufv_rn_poc
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ufv_rn_poc/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ./ufv_rn_poc/ios
        if: hashFiles('ufv_rn_poc/ios/Podfile') != ''
        run: pod install

      - name: Build iOS Application (Unsigned)
        working-directory: ./ufv_rn_poc/ios
        if: hashFiles('ufv_rn_poc/ios/*.xcworkspace') != ''
        run: |
          xcodebuild clean build \
            -workspace ufv_rn_poc.xcworkspace \
            -scheme ufv_rn_poc \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -destination 'generic/platform=iOS'

      - name: Package Payload to IPA
        if: hashFiles('ufv_rn_poc/ios/build/Release-iphoneos/*.app') != ''
        run: |
          mkdir -p Payload
          cp -r ufv_rn_poc/ios/build/Release-iphoneos/*.app Payload/
          zip -r UniversalFileViewer_unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        if: hashFiles('UniversalFileViewer_unsigned.ipa') != ''
        with:
          name: UniversalFileViewer-iOS-Unsigned
          path: UniversalFileViewer_unsigned.ipa
          retention-days: 14

