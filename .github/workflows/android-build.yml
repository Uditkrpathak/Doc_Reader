name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies
        working-directory: ./ufv_rn_poc
        run: npm install --legacy-peer-deps

      - name: Grant execute permission for gradlew
        working-directory: ./ufv_rn_poc/android
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Release APKs
        working-directory: ./ufv_rn_poc/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalFileViewer-arm64-v8a
          path: ufv_rn_poc/android/app/build/outputs/apk/release/*arm64-v8a*.apk
          retention-days: 14

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalFileViewer-universal
          path: ufv_rn_poc/android/app/build/outputs/apk/release/*universal*.apk
          retention-days: 14

